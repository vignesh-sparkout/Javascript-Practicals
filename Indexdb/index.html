<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main class="app">
        <div class="todo-header">
            <h1>Task List</h1>
            <p>Saved in your browser</p>
        </div>

        <div class="input-section">
            <input type="text" id="input" placeholder="Add a new task" autocomplete="off" />
            <button id="add-btn" disabled>Add</button>
        </div>

        <p id="status" class="status">Opening database...</p>
        <ul id="list" class="task-list"></ul>
    </main>

    <script src="./index.js"></script>
</body>
</html>
